<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Maison Auto Peche V5</title><style>body{margin:0;background:#061015;color:#eef9ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:14px 14px 90px}.card{background:#0b1f2a;border:1px solid #294a5a;border-radius:18px;padding:14px;margin:12px 0}.row{display:flex;gap:12px;align-items:center}.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#68cbff 0deg,#19313d 0deg)}.in{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#061015;font-size:32px;font-weight:900}.plan{font-size:42px;font-weight:900}.m{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff18;padding:8px 0}.m span:first-child{color:#9bb6c4}.ok{color:#57d878}.bad{color:#ff5470}.warn{color:#ffd166}button,select{background:#14506a;color:white;border:1px solid #386d83;border-radius:13px;padding:12px;font:inherit;font-weight:800}select{width:100%;background:#06131a}.nav{position:fixed;bottom:0;left:0;right:0;background:#061015;border-top:1px solid #294a5a;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.nav button{font-size:12px}pre{white-space:pre-wrap;background:#06131a;border:1px solid #294a5a;border-radius:14px;padding:10px;font-size:12px}</style></head><body><h1>🎣 Grand Maison Auto Peche V5</h1><div id="status">Chargement live...</div><section class="card"><h2>Verdict</h2><div class="row"><div class="ring" id="ring"><div class="in" id="score">--</div></div><div><div>Plan</div><div class="plan" id="plan">--</div><div id="name">--</div></div></div><p id="why"></p><p id="safe"></p></section><section class="card"><h2>Setup auto</h2><div id="setup">--</div></section><section class="card"><h2>Live</h2><div id="live">--</div></section><section class="card"><h2>Spots & creneaux</h2><div id="spots">--</div></section><section class="card"><h2>Reglages</h2><select id="water" onchange="render()"><option value="cold">eau froide</option><option value="cool" selected>eau fraiche</option><option value="mild">eau douce</option></select><select id="clar" onchange="render()"><option value="clear" selected>eau claire</option><option value="stained">eau teintee</option><option value="dirty">eau trouble</option></select></section><section class="card"><h2>Assistant</h2><pre id="txt">--</pre></section><div class="nav"><button onclick="sync()">Live</button><button onclick="log('TOUCHE')">Touche</button><button onclick="log('PRISE')">Prise</button><button onclick="share()">Share</button></div><script>let W=null,C={lat:45.20556,lon:6.125,alt:1698},logs=JSON.parse(localStorage.gm5logs||'[]'),cur=null;const spots=[['A1','Tete de lac arrivees','A','0-6m','fluoro 16-18 cuillere n1'],['A2','Anse nord','A','2-12m','ondulante naturelle'],['B1','Digue profond','B','10-40m','ondulante 10-14g'],['B2','Rive route','B','3-18m','cuillere n2'],['C1','Rive vent','C','1-10m','leurre dense contraste']];const wc={0:'clair',1:'peu nuageux',2:'nuageux',3:'couvert',61:'pluie faible',63:'pluie',65:'pluie forte',80:'averses',81:'averses',82:'averses fortes',95:'orage',96:'orage grele',99:'orage fort'};function q(x){return document.getElementById(x)}function n(v,d=0){v=Number(v);return isFinite(v)?v:d}function f(v,u=''){return Math.round(n(v))+u}function cp(d){let a=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];return a[Math.floor(n(d)/22.5+.5)%16]}function url(){let h='temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,cape';return `https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&elevation=${C.alt}&hourly=${h}&timezone=Europe%2FParis&forecast_days=4&wind_speed_unit=kmh`}function fallback(){let now=new Date();now.setMinutes(0,0,0);let h={time:[],temperature_2m:[],apparent_temperature:[],precipitation_probability:[],precipitation:[],weather_code:[],pressure_msl:[],cloud_cover:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],uv_index:[],cape:[]};for(let i=0;i<96;i++){let d=new Date(now.getTime()+i*36e5),hr=d.getHours(),heat=Math.max(0,Math.sin((hr-6)/24*Math.PI*2));h.time.push(d.toISOString());h.temperature_2m.push(10+heat*12);h.apparent_temperature.push(9+heat*12);h.precipitation_probability.push(20+(hr>=14&&hr<=19?25:0));h.precipitation.push(0);h.weather_code.push(2);h.pressure_msl.push(1015);h.cloud_cover.push(55);h.wind_speed_10m.push(12);h.wind_direction_10m.push(240);h.wind_gusts_10m.push(22);h.uv_index.push(hr>=10&&hr<=16?5:0);h.cape.push(250)}return{hourly:h}}function near(){let t=W.hourly.time,b=0,bd=1e99,now=Date.now();t.forEach((x,i)=>{let d=Math.abs(new Date(x)-now);if(d<bd){bd=d;b=i}});return b}function evalH(i){let h=W.hourly,d=new Date(h.time[i]),hr=d.getHours(),water=q('water').value,clar=q('clar').value,x={temp:n(h.temperature_2m[i]),feel:n(h.apparent_temperature[i]),pp:n(h.precipitation_probability[i]),code:n(h.weather_code[i]),p:n(h.pressure_msl[i]),cloud:n(h.cloud_cover[i]),wind:n(h.wind_speed_10m[i]),dir:n(h.wind_direction_10m[i]),gust:n(h.wind_gusts_10m[i]),uv:n(h.uv_index[i]),cape:n(h.cape[i]),date:d};let sc=33,why=[];if(hr<=8||hr>=19){sc+=24;why.push('faible lumiere')}else if(hr>=11&&hr<=16){sc+=2;why.push('plein jour')}else{sc+=10;why.push('intermediaire')}if(x.wind>=6&&x.wind<=18){sc+=14;why.push('vent porteur')}else if(x.wind>28){sc-=14;why.push('vent dur')}if(x.gust>=45){sc-=18;why.push('rafales fortes')}if(x.pp<=20){sc+=7;why.push('faible pluie')}else if(x.pp>55){sc-=9;why.push('pluie probable')}if(x.cloud>=35&&x.cloud<=85){sc+=9;why.push('lumiere cassee')}if(x.uv>=5&&x.cloud<30){sc-=11;why.push('soleil dur')}if(water=='cool')sc+=5;else if(water=='mild')sc-=4;if(clar=='clear')sc-=2;else if(clar=='stained')sc+=5;else sc-=7;let danger=[95,96,99].includes(x.code)||x.gust>=55||(x.cape>=900&&x.pp>=35);if(danger){sc=Math.min(sc,12);why.unshift('STOP securite')}sc=Math.max(0,Math.min(100,Math.round(sc)));let plan='B',name='cassures profond',depth='6-18m',line='fluoro 20-22',lure='ondulante 7-14g / souple',anim='descente lente';if(danger){plan='STOP';name='repli';depth='aucune peche';line='-';lure='-';anim='canne rangee'}else if(sc>=74&&(hr<=9||hr>=18)){plan='A';name='bordures arrivees';depth='0-6m';line='fluoro 16-18';lure='cuillere n1-2';anim='lent discret'}else if(sc>=62&&x.wind>=8&&clar!='clear'){plan='C';name='rive vent';depth='1-10m';line='fluoro 18-22';lure='leurre dense contraste';anim='10 min poste'}else if(sc<52){plan='C';name='prospection';depth='variable'}return{...x,sc,why,danger,plan,name,depth,line,lure,anim,met:wc[x.code]||'code '+x.code,comp:cp(x.dir)}}function scoreSpot(s,r){if(r.plan=='STOP')return 0;let sc=45+(s[2]==r.plan?30:0)+(r.plan=='A'&&s[0]=='A1'?18:0)+(r.plan=='B'&&s[0]=='B1'?18:0)+(r.plan=='C'&&s[0]=='C1'?16:0);return Math.max(0,Math.min(100,sc))}function render(){if(!W)W=fallback();cur=evalH(near());let r=cur,col=r.danger?'#ff5470':r.sc>=74?'#57d878':r.sc>=52?'#ffd166':'#ff5470';q('ring').style.background=`conic-gradient(${col} ${r.sc*3.6}deg,#19313d 0deg)`;q('score').textContent=r.sc;q('plan').textContent=r.plan;q('name').textContent=r.name;q('why').textContent=r.why.join(' • ');q('safe').innerHTML=r.danger?'<b class=bad>STOP.</b> canne rangee':'<b class=ok>OK controle.</b> peche possible';q('setup').innerHTML=`<div class=m><span>Profondeur</span><span>${r.depth}</span></div><div class=m><span>Ligne</span><span>${r.line}</span></div><div class=m><span>Leurre</span><span>${r.lure}</span></div><div class=m><span>Animation</span><span>${r.anim}</span></div>`;q('live').innerHTML=`<div class=m><span>Meteo</span><span>${r.met}</span></div><div class=m><span>Air</span><span>${f(r.temp,'°C')}</span></div><div class=m><span>Vent</span><span>${f(r.wind,' km/h')} ${r.comp} raf ${f(r.gust)}</span></div><div class=m><span>Pluie</span><span>${f(r.pp,'%')}</span></div><div class=m><span>Pression</span><span>${f(r.p,' hPa')}</span></div>`;let all=[];for(let i=near();i<Math.min(near()+48,W.hourly.time.length);i++)all.push(evalH(i));let best=all.filter(x=>!x.danger).sort((a,b)=>b.sc-a.sc).slice(0,5);let sl=spots.map(s=>({s,sc:scoreSpot(s,r)})).sort((a,b)=>b.sc-a.sc);q('spots').innerHTML=sl.map(o=>`<div class=m><span>${o.s[1]}<br><small class=s>${o.s[3]} ${o.s[4]}</small></span><span>${o.sc}/100</span></div>`).join('')+'<h3>Creneaux</h3>'+best.map(x=>`<div class=m><span>${x.date.toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'})}</span><span>${x.sc}/100 ${x.plan}</span></div>`).join('');q('txt').textContent=`ASSISTANT AUTO GRAND MAISON V5\n${new Date().toLocaleString('fr-FR')}\n\nPlan ${r.plan} - ${r.name} - ${r.sc}/100\nMeteo ${r.met}, ${f(r.temp,'°C')}, vent ${f(r.wind,' km/h')} ${r.comp}, raf ${f(r.gust,' km/h')}\nSetup ${r.depth} | ${r.line} | ${r.lure} | ${r.anim}\nSpot ${sl[0]?.s[1]} (${sl[0]?.sc}/100)\nRegle 15 min sans signal = changer angle, 30 min = changer zone, orage = STOP.`}async function sync(){q('status').textContent='synchro live...';try{let res=await fetch(url(),{cache:'no-store'});if(!res.ok)throw Error(res.status);W=await res.json();localStorage.gm5w=JSON.stringify(W);q('status').textContent='live OK '+new Date().toLocaleTimeString('fr-FR')}catch(e){try{W=JSON.parse(localStorage.gm5w);q('status').textContent='cache utilise'}catch(_){W=fallback();q('status').textContent='secours utilise'}}render();log('AUTO')}function log(t){if(!cur)render();logs.push({at:new Date().toISOString(),t,score:cur.sc,plan:cur.plan});logs=logs.slice(-100);localStorage.gm5logs=JSON.stringify(logs)}async function copyT(){await navigator.clipboard.writeText(q('txt').textContent);alert('copie')}async function share(){if(navigator.share)navigator.share({text:q('txt').textContent,title:'Peche GM'});else copyT()}window.sync=sync;window.render=render;window.log=log;window.share=share;try{W=JSON.parse(localStorage.gm5w)}catch(e){}render();sync();setInterval(sync,300000);setInterval(render,30000)</script></body></html>
