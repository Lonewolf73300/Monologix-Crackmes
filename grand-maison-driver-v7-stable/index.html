<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GM V7"><title>Grand Maison Driver V7 Stable</title><style>body{margin:0;background:#04090d;color:#edf9ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;padding:12px 12px 92px}header{position:sticky;top:0;z-index:9;background:#04090df2;border-bottom:1px solid #294a5a;padding:12px 0}h1{font-size:19px;margin:0;font-weight:950}h2{font-size:16px;margin:0 0 9px}.s,label{font-size:12px;color:#9bb6c4}.card{background:linear-gradient(180deg,#102936,#07141b);border:1px solid #294a5a;border-radius:18px;padding:13px;margin:11px 0}.card.alert{border-color:#ff5470;background:linear-gradient(180deg,#4b1323,#07141b)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.k{background:#06131a;border:1px solid #294a5a;border-radius:15px;padding:10px}.k b{display:block;font-size:19px}.m{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ffffff18;padding:8px 0}.m span:first-child{color:#9bb6c4}.m span:last-child{text-align:right;font-weight:850}.ok{color:#57d878}.warn{color:#ffd166}.bad{color:#ff5470}button,select,textarea{font:inherit;border:1px solid #294a5a;background:#06131a;color:#edf9ff;border-radius:13px;padding:11px 12px;margin:3px}button{font-weight:850;background:#14506a}.sec{background:#06131a}.good{background:#116331}.danger{background:#7a1730}select,textarea{width:100%}.ring{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#68cbff 0deg,#19313d 0deg)}.in{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#04090d;font-size:32px;font-weight:1000}.plan{font-size:40px;font-weight:1000}pre{white-space:pre-wrap;background:#06131a;border:1px solid #294a5a;border-radius:14px;padding:10px;font-size:12px;line-height:1.45;max-height:360px;overflow:auto}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#04090df2;border-top:1px solid #294a5a;padding:8px}.nav button{font-size:11px;padding:9px 3px}.map{background:#06131a;border:1px solid #294a5a;border-radius:14px;padding:8px}svg{width:100%;height:auto}</style></head><body><header><h1>🎣 Grand Maison Driver V7 Stable</h1><div id="st" class="s">initialisation...</div></header><section class="card" id="scoreCard"><h2>Driver live</h2><div class="row"><div class="ring" id="ring"><div class="in" id="score">--</div></div><div><div class="s">Plan</div><div class="plan" id="plan">--</div><div id="name">--</div></div></div><p class="s" id="why">--</p><p id="safe">--</p></section><section class="card"><h2>Action minute</h2><div id="driver">--</div></section><section class="card"><h2>Synchro ligne live</h2><div id="line">--</div></section><section class="card"><h2>Indicateurs</h2><div class="grid"><div class="k"><span class="s">Air</span><b id="temp">--</b></div><div class="k"><span class="s">Vent</span><b id="wind">--</b></div><div class="k"><span class="s">Pluie</span><b id="rain">--</b></div><div class="k"><span class="s">Pression</span><b id="pres">--</b></div><div class="k"><span class="s">Radar</span><b id="rad">--</b></div><div class="k"><span class="s">GPS</span><b id="gps">--</b></div></div></section><section class="card"><h2>Spots + creneaux</h2><div id="spots">--</div></section><section class="card"><h2>Reglages terrain</h2><label>Eau</label><select id="water" onchange="save();render()"><option value="cold">froide 6-10</option><option value="cool" selected>fraiche 10-14</option><option value="mild">douce 14-18</option></select><label>Clarte</label><select id="clar" onchange="save();render()"><option value="clear" selected>claire</option><option value="stained">teinte</option><option value="dirty">trouble</option></select><label>Ligne</label><select id="lineType" onchange="save();render()"><option value="nylon">nylon</option><option value="braid">tresse</option></select><label>Canne</label><select id="rod" onchange="save();render()"><option value="light">light</option><option value="ml" selected>medium-light</option><option value="m">medium</option></select></section><section class="card"><h2>Carte simple</h2><div class="map"><svg viewBox="0 0 900 480"><rect width="900" height="480" fill="#06131a"/><path d="M130 360 C120 292,170 245,280 210 C405 170,500 112,640 62 C745 25,825 55,842 118 C860 198,790 248,700 292 C610 340,500 390,380 415 C260 440,155 420,130 360Z" fill="#12536b" stroke="#68cbff" stroke-width="4"/><circle cx="790" cy="105" r="16" fill="#57d878"/><text x="812" y="111" fill="#edf9ff">A1 arrivees</text><circle cx="515" cy="205" r="16" fill="#57d878"/><text x="537" y="211" fill="#edf9ff">A2 anse</text><circle cx="170" cy="365" r="16" fill="#68cbff"/><text x="192" y="371" fill="#edf9ff">B1 profond</text><circle cx="365" cy="392" r="16" fill="#ffd166"/><text x="387" y="398" fill="#edf9ff">B2 route</text><circle cx="640" cy="282" r="16" fill="#ffd166"/><text x="662" y="288" fill="#edf9ff">C1 vent</text></svg></div></section><section class="card"><h2>Brief assistant</h2><pre id="txt">--</pre><button class="sec" onclick="shareT()">Partager</button><button class="sec" onclick="copyT()">Copier</button></section><section class="card"><h2>Journal</h2><div class="row"><button onclick="mark('TOUCHE')">Touche</button><button class="good" onclick="mark('PRISE')">Prise</button><button class="sec" onclick="mark('SUIVI')">Suivi</button><button class="danger" onclick="mark('RIEN')">Rien</button></div><textarea id="note" placeholder="note terrain"></textarea><button onclick="note()">Ajouter note</button><div id="logs">--</div></section><div class="nav"><button onclick="sync()">Live</button><button onclick="mark('TOUCHE')">Touche</button><button onclick="mark('PRISE')">Prise</button><button onclick="gps()">GPS</button><button onclick="shareT()">Share</button></div><script>const C={lat:45.20556,lon:6.125,alt:1698},WC={0:'clair',1:'peu nuageux',2:'nuageux',3:'couvert',61:'pluie faible',63:'pluie',65:'pluie forte',80:'averses',81:'averses',82:'averses fortes',95:'orage',96:'orage grele',99:'orage fort'};let W=null,R=null,U=null,cur=null,logs=JSON.parse(localStorage.gm7slogs||'[]');const SP=[['A1','Tete de lac arrivees','A',45.220846,6.142864,'0-6m','oxygene bordure'],['A2','Anse nord cassure','A',45.2107,6.1268,'2-12m','passage bordure'],['B1','Digue profond','B',45.206,6.11707,'10-40m+','poisson bas'],['B2','Rive route','B',45.2032,6.1261,'3-18m','prospection'],['C1','Rive vent','C',45.214,6.135,'1-10m','vent propre']];function q(x){return document.getElementById(x)}function n(v,d=0){v=Number(v);return isFinite(v)?v:d}function f(v,u=''){return Math.round(n(v))+u}function cp(d){let a=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];return a[Math.floor(n(d)/22.5+.5)%16]}function set(){return{water:q('water').value,clar:q('clar').value,line:q('lineType').value,rod:q('rod').value}}function save(){localStorage.gm7sset=JSON.stringify(set())}function load(){try{let s=JSON.parse(localStorage.gm7sset||'{}');if(s.water)q('water').value=s.water;if(s.clar)q('clar').value=s.clar;if(s.line)q('lineType').value=s.line;if(s.rod)q('rod').value=s.rod}catch(e){}try{W=JSON.parse(localStorage.gm7sweather)}catch(e){}}function url(){let h='temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,cape';return `https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&elevation=${C.alt}&hourly=${h}&timezone=Europe%2FParis&forecast_days=4&wind_speed_unit=kmh`}function fb(){let now=new Date();now.setMinutes(0,0,0);let h={time:[],temperature_2m:[],apparent_temperature:[],precipitation_probability:[],precipitation:[],weather_code:[],pressure_msl:[],cloud_cover:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],uv_index:[],cape:[]};for(let i=0;i<96;i++){let d=new Date(now.getTime()+i*36e5),hr=d.getHours(),heat=Math.max(0,Math.sin((hr-6)/24*Math.PI*2));h.time.push(d.toISOString());h.temperature_2m.push(10+heat*12);h.apparent_temperature.push(9+heat*12);h.precipitation_probability.push(20+(hr>=14&&hr<=19?25:0));h.precipitation.push(0);h.weather_code.push(2);h.pressure_msl.push(1015);h.cloud_cover.push(55);h.wind_speed_10m.push(12);h.wind_direction_10m.push(240);h.wind_gusts_10m.push(22);h.uv_index.push(hr>=10&&hr<=16?5:0);h.cape.push(250)}return{hourly:h}}function near(){let t=W.hourly.time,b=0,bd=1e99,now=Date.now();t.forEach((x,i)=>{let d=Math.abs(new Date(x)-now);if(d<bd){bd=d;b=i}});return b}function ev(i){let h=W.hourly,d=new Date(h.time[i]),hr=d.getHours(),s=set(),x={date:d,temp:n(h.temperature_2m[i]),feel:n(h.apparent_temperature[i]),pp:n(h.precipitation_probability[i]),code:n(h.weather_code[i]),p:n(h.pressure_msl[i]),cloud:n(h.cloud_cover[i]),wind:n(h.wind_speed_10m[i]),dir:n(h.wind_direction_10m[i]),gust:n(h.wind_gusts_10m[i]),uv:n(h.uv_index[i]),cape:n(h.cape[i])};let sc=33,why=[];if(hr<=8||hr>=19){sc+=24;why.push('faible lumiere')}else if(hr>=11&&hr<=16){sc+=2;why.push('plein jour')}else{sc+=10;why.push('intermediaire')}if(x.wind>=6&&x.wind<=18){sc+=14;why.push('vent porteur')}else if(x.wind>18&&x.wind<=28){sc+=8;why.push('vent exploitable')}else if(x.wind>28){sc-=14;why.push('vent dur')}if(x.gust>=45){sc-=18;why.push('rafales fortes')}if(x.pp<=20){sc+=7;why.push('faible pluie')}else if(x.pp>55){sc-=9;why.push('pluie probable')}if(x.cloud>=35&&x.cloud<=85){sc+=9;why.push('lumiere cassee')}if(x.uv>=5&&x.cloud<30){sc-=11;why.push('soleil dur')}if(s.water==='cool')sc+=5;else if(s.water==='mild')sc-=4;if(s.clar==='clear')sc-=2;else if(s.clar==='stained')sc+=5;else sc-=7;let danger=[95,96,99].includes(x.code)||x.gust>=55||(x.cape>=900&&x.pp>=35);if(danger){sc=Math.min(sc,12);why.unshift('STOP securite')}sc=Math.max(0,Math.min(100,Math.round(sc)));let plan='B',name='cassures profond',depth='6-18m',leader='20-22/100',lure='ondulante 7-14g / souple',anim='descente comptee lente';if(danger){plan='STOP';name='repli';depth='aucune peche';leader='-';lure='-';anim='canne rangee'}else if(sc>=74&&(hr<=9||hr>=18)){plan='A';name='bordures arrivees';depth='0-6m';leader='16-18/100';lure='cuillere n1-2 / minnow';anim='lent discret'}else if(sc>=62&&x.wind>=8&&s.clar!=='clear'){plan='C';name='rive vent prospection';depth='1-10m';leader='18-22/100';lure='leurre dense contraste';anim='10 min/poste'}else if(sc<52){plan='C';name='prospection prudente';depth='variable';leader='18-22/100';lure='dense visible';anim='changer vite'}let main=s.line==='braid'?'tresse fine + fluoro':'nylon direct + fluoro';return{...x,score:sc,why,danger,plan,name,depth,leader,lure,anim,main,met:WC[x.code]||'code '+x.code,comp:cp(x.dir)}}function dist(a,b,c,d){let R=6371,rd=Math.PI/180,z=Math.sin((c-a)*rd/2)**2+Math.cos(a*rd)*Math.cos(c*rd)*Math.sin((d-b)*rd/2)**2;return 2*R*Math.asin(Math.sqrt(z))}function scSpot(s,r){if(r.plan==='STOP')return 0;let sc=45+(s[2]===r.plan?30:0)+(r.plan==='A'&&s[0]==='A1'?18:0)+(r.plan==='B'&&s[0]==='B1'?18:0)+(r.plan==='C'&&s[0]==='C1'?16:0);if(U){s.d=dist(U.lat,U.lon,s[3],s[4]);if(s.d<1)sc+=8}return Math.max(0,Math.min(100,Math.round(sc)))}function driver(r){if(r.plan==='STOP')return'STOP: range canne, eloigne-toi des rives exposees.';if(r.plan==='A')return'A1/A2: 5 lancers par angle, approche basse, fluoro fin, naturel.';if(r.plan==='B')return'B1/B2: profondeur. Compte 8s, 14s, 20s avant couleur.';return'C1: vent propre, leurre dense, 10 min par poste puis bouge.'}function render(){if(!W)W=fb();cur=ev(near());let r=cur,col=r.danger?'#ff5470':r.score>=74?'#57d878':r.score>=52?'#ffd166':'#ff5470';q('ring').style.background=`conic-gradient(${col} ${r.score*3.6}deg,#19313d 0deg)`;q('score').textContent=r.score;q('plan').textContent=r.plan;q('name').textContent=r.name;q('why').textContent=r.why.join(' • ');q('scoreCard').classList.toggle('alert',r.danger);q('safe').innerHTML=r.danger?'<b class=bad>STOP.</b> canne rangee':'<b class=ok>OK controle.</b>';q('driver').innerHTML=`<div class=m><span>Consigne</span><span>${driver(r)}</span></div><div class=m><span>Cadence</span><span>15 min angle / 30 min zone</span></div>`;q('line').innerHTML=`<div class=m><span>Corps</span><span>${r.main}</span></div><div class=m><span>Bas ligne</span><span>${r.leader} - 1.2/1.5m</span></div><div class=m><span>Leurre</span><span>${r.lure}</span></div><div class=m><span>Animation</span><span>${r.anim}</span></div>`;q('temp').textContent=f(r.temp,'°C');q('wind').textContent=f(r.wind,' km/h')+' '+r.comp;q('rain').textContent=f(r.pp,'%');q('pres').textContent=f(r.p,' hPa');q('rad').textContent=R?R.label:'--';q('gps').textContent=U?'OK':'--';let all=[];for(let i=near();i<Math.min(near()+48,W.hourly.time.length);i++)all.push(ev(i));let best=all.filter(x=>!x.danger).sort((a,b)=>b.score-a.score).slice(0,5);let sl=SP.map(s=>({s,score:scSpot(s,r)})).sort((a,b)=>b.score-a.score);q('spots').innerHTML=sl.map(o=>`<div class=m><span>${o.s[1]}<br><small class=s>${o.s[5]} ${o.s[6]}${o.s.d?' '+o.s.d.toFixed(1)+'km':''}</small></span><span>${o.score}/100</span></div>`).join('')+'<h2>Creneaux</h2>'+best.map(x=>`<div class=m><span>${x.date.toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'})}</span><span>${x.score}/100 ${x.plan}</span></div>`).join('');q('txt').textContent=`GM DRIVER V7 STABLE\n${new Date().toLocaleString('fr-FR')}\nPlan ${r.plan} - ${r.name} - ${r.score}/100\n${driver(r)}\nMeteo ${r.met}, ${f(r.temp,'°C')}, vent ${f(r.wind,' km/h')} ${r.comp}, rafales ${f(r.gust,' km/h')}, pluie ${f(r.pp,'%')}\nLigne ${r.main} | fluoro ${r.leader} | ${r.lure} | ${r.anim}\nSpot ${sl[0]?.s[1]} (${sl[0]?.score}/100)\nRegle 5 lancers angle, 15 min angle, 30 min zone, orage STOP.`;renderLogs()}async function sync(){q('st').textContent='synchro live...';try{let res=await fetch(url(),{cache:'no-store'});if(!res.ok)throw Error(res.status);W=await res.json();localStorage.gm7sweather=JSON.stringify(W);q('st').textContent='live OK '+new Date().toLocaleTimeString('fr-FR')}catch(e){try{W=JSON.parse(localStorage.gm7sweather);q('st').textContent='cache utilise'}catch(_){W=fb();q('st').textContent='secours utilise'}}try{let rr=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'}),j=await rr.json(),fr=[...(j.radar?.past||[]),...(j.radar?.nowcast||[])],last=fr[fr.length-1];R={label:last?'OK':'--'}}catch(e){R={label:'KO'}}render();mark('AUTO')}function mark(t){if(!cur)render();logs.push({at:new Date().toISOString(),type:t,score:cur.score,plan:cur.plan,lure:cur.lure});logs=logs.slice(-300);localStorage.gm7slogs=JSON.stringify(logs);renderLogs();if(navigator.vibrate)navigator.vibrate(80)}function note(){let v=q('note').value;if(v){mark('NOTE '+v);q('note').value=''}}function renderLogs(){q('logs').innerHTML=logs.slice(-8).reverse().map(l=>`<div class=m><span>${new Date(l.at).toLocaleString('fr-FR')}<br><small class=s>${l.type}</small></span><span>${l.score}/100 ${l.plan}</span></div>`).join('')||'<p class=s>aucun log</p>'}function gps(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{U={lat:p.coords.latitude,lon:p.coords.longitude};render()},e=>alert('GPS refuse '+e.message),{enableHighAccuracy:true}):alert('GPS non dispo')}async function copyT(){await navigator.clipboard.writeText(q('txt').textContent);alert('copie')}function shareT(){navigator.share?navigator.share({text:q('txt').textContent,title:'GM Driver V7'}):copyT()}window.sync=sync;window.render=render;window.mark=mark;window.note=note;window.gps=gps;window.shareT=shareT;window.copyT=copyT;window.save=save;load();if(!W)W=fb();render();sync();setInterval(sync,300000);setInterval(render,30000)</script></body></html>
