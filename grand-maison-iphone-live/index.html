<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061015"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GM Pêche"><title>Grand'Maison Pêche iPhone</title><style>*{box-sizing:border-box}body{margin:0;background:#061015;color:#eef9ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;padding:12px 12px 96px}header{position:sticky;top:0;background:rgba(6,16,21,.95);backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid #274858;z-index:10}h1{font-size:20px;margin:0;font-weight:900}h2{font-size:16px;margin:0 0 10px}.small{font-size:12px;color:#9bb6c4}.card{background:linear-gradient(180deg,#102936,#07141b);border:1px solid #294a5a;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 16px 45px rgba(0,0,0,.25)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.metric{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);padding:9px 0}.metric:last-child{border-bottom:0}.metric span:first-child{color:#9bb6c4}.metric span:last-child{text-align:right;font-weight:800}button,select,textarea{font:inherit;border:1px solid #294a5a;border-radius:13px;background:#07141b;color:#eef9ff;padding:11px 12px}button{font-weight:850;background:#14506a}button.red{background:#6d162b}button.grey{background:#07141b}select{width:100%;margin:4px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:#061015;border:1px solid #294a5a;border-radius:15px;padding:10px;min-height:74px}.kpi b{display:block;font-size:20px}.ok{color:#57d878}.warn{color:#ffd166}.bad{color:#ff5470}.ring{width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#68cbff 0deg,#19313d 0deg);border:1px solid #3c6475}.inner{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#061015;font-size:32px;font-weight:1000}.plan{font-size:40px;font-weight:1000}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(6,16,21,.96);border-top:1px solid #294a5a;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{font-size:12px;padding:10px 4px}pre{white-space:pre-wrap;background:#061015;border:1px solid #294a5a;border-radius:14px;padding:10px;font-size:12px;line-height:1.45;max-height:330px;overflow:auto}.map{background:#061015;border:1px solid #294a5a;border-radius:16px;padding:8px}svg{width:100%;height:auto;display:block}</style></head><body><header><h1>🎣 Grand'Maison Pêche iPhone</h1><div class="small" id="status">Chargement...</div></header><section class="card"><h2>Verdict live</h2><div class="row"><div class="ring" id="ring"><div class="inner" id="score">--</div></div><div><div class="small">Plan</div><div class="plan" id="plan">--</div><div id="planName">--</div></div></div><p class="small" id="why">--</p><p id="security">--</p></section><section class="card"><h2>Setup maintenant</h2><div id="setup">--</div></section><section class="card"><h2>Météo</h2><div class="grid"><div class="kpi"><span class="small">Air</span><b id="temp">--</b></div><div class="kpi"><span class="small">Vent</span><b id="wind">--</b></div><div class="kpi"><span class="small">Pluie</span><b id="rain">--</b></div><div class="kpi"><span class="small">Pression</span><b id="pressure">--</b></div></div></section><section class="card"><h2>Réglages terrain</h2><label class="small">Eau</label><select id="water" onchange="render()"><option value="cold">Froide 6-10°C</option><option selected value="cool">Fraîche 10-14°C</option><option value="mild">Douce 14-18°C</option></select><label class="small">Clarté</label><select id="clarity" onchange="render()"><option selected value="clear">Claire</option><option value="stained">Teintée</option><option value="dirty">Trouble</option></select></section><section class="card"><h2>Assistant</h2><pre id="txt">--</pre><div class="row"><button class="grey" onclick="copyTxt()">Copier</button><button class="grey" onclick="shareTxt()">Partager</button></div></section><section class="card"><h2>Spots</h2><div id="spots">--</div></section><section class="card"><h2>Carte simple</h2><div class="map"><svg viewBox="0 0 900 480"><rect width="900" height="480" fill="#061015"/><path d="M130 360 C120 292,170 245,280 210 C405 170,500 112,640 62 C745 25,825 55,842 118 C860 198,790 248,700 292 C610 340,500 390,380 415 C260 440,155 420,130 360Z" fill="#12536b" stroke="#68cbff" stroke-width="4"/><circle cx="790" cy="105" r="16" fill="#57d878"/><text x="812" y="111" fill="#eef9ff">A1 arrivées</text><circle cx="515" cy="205" r="16" fill="#57d878"/><text x="537" y="211" fill="#eef9ff">A2 anse</text><circle cx="170" cy="365" r="16" fill="#68cbff"/><text x="192" y="371" fill="#eef9ff">B1 profond</text><circle cx="365" cy="392" r="16" fill="#ffd166"/><text x="387" y="398" fill="#eef9ff">B2 route</text><circle cx="640" cy="282" r="16" fill="#ffd166"/><text x="662" y="288" fill="#eef9ff">C1 vent</text></svg></div></section><div class="nav"><button onclick="sync()">↻ Live</button><button onclick="log('TOUCHE')">⚡ Touche</button><button onclick="log('PRISE')">🎣 Prise</button><button onclick="shareTxt()">↗ Share</button></div><script>const LAT=45.20556,LON=6.125,ALT=1698;let weather=null,current=null,logs=JSON.parse(localStorage.gm_logs||'[]');const spots=[['A1','Tête de lac / arrivées d’eau','A','0-6 m','cuillère n°1-2, fluoro 16-18/100'],['A2','Anse nord / cassure','A','2-12 m','ondulante 5-7 g, naturel'],['B1','Digue / profond','B','10-40 m+','ondulante 10-14 g ou souple 5-7 g'],['B2','Rive route / cassures','B','3-18 m','ondulante 7-12 g'],['C1','Rive battue par vent','C','1-10 m','leurre dense, couleur contrastée']];const W={0:'clair',1:'peu nuageux',2:'partiellement nuageux',3:'couvert',61:'pluie faible',63:'pluie',65:'pluie forte',80:'averses',81:'averses',82:'averses fortes',95:'orage',96:'orage + grêle',99:'orage fort'};function q(id){return document.getElementById(id)}function n(v,d=0){v=Number(v);return isFinite(v)?v:d}function f(v,u=''){return Math.round(n(v))+u}function comp(d){let a=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];return a[Math.floor(n(d)/22.5+.5)%16]}function url(){let h='temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index,cape';return `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&elevation=${ALT}&hourly=${h}&daily=sunrise,sunset&timezone=Europe%2FParis&forecast_days=4&wind_speed_unit=kmh`}function fallback(){let now=new Date();now.setMinutes(0,0,0);let h={time:[],temperature_2m:[],apparent_temperature:[],precipitation_probability:[],precipitation:[],weather_code:[],pressure_msl:[],cloud_cover:[],wind_speed_10m:[],wind_direction_10m:[],wind_gusts_10m:[],uv_index:[],cape:[]};for(let i=0;i<96;i++){let d=new Date(now.getTime()+i*36e5),hr=d.getHours(),heat=Math.max(0,Math.sin((hr-6)/24*Math.PI*2)),storm=hr>=14&&hr<=19?20:0;h.time.push(d.toISOString());h.temperature_2m.push(10+heat*12);h.apparent_temperature.push(9+heat*12);h.precipitation_probability.push(Math.max(5,Math.min(85,20+storm+Math.sin(i/5)*15)));h.precipitation.push(h.precipitation_probability[i]>55?.8:0);h.weather_code.push(h.precipitation_probability[i]>65?80:2);h.pressure_msl.push(1015+Math.sin(i/10)*3);h.cloud_cover.push(Math.max(20,Math.min(90,50+Math.sin(i/4)*25)));h.wind_speed_10m.push(12+Math.sin(i/5)*5);h.wind_direction_10m.push(240);h.wind_gusts_10m.push(h.wind_speed_10m[i]+8);h.uv_index.push(hr>=10&&hr<=16?5:0);h.cape.push(250+storm*35)}return{hourly:h,daily:{time:[],sunrise:[],sunset:[]},source:'secours'}}function nearest(){let t=weather.hourly.time,now=Date.now(),b=0,bd=1e99;t.forEach((x,i)=>{let d=Math.abs(new Date(x)-now);if(d<bd){bd=d;b=i}});return b}function evalH(i){let h=weather.hourly,date=new Date(h.time[i]),hr=date.getHours(),water=q('water').value,clar=q('clarity').value;let x={date,temp:n(h.temperature_2m[i],12),feel:n(h.apparent_temperature[i],11),pp:n(h.precipitation_probability[i],20),code:n(h.weather_code[i],2),p:n(h.pressure_msl[i],1015),cloud:n(h.cloud_cover[i],50),wind:n(h.wind_speed_10m[i],12),dir:n(h.wind_direction_10m[i],240),gust:n(h.wind_gusts_10m[i],22),uv:n(h.uv_index[i],4),cape:n(h.cape[i],250)};let score=33,why=[];if(hr<=8||hr>=19){score+=24;why.push('faible lumière')}else if(hr>=11&&hr<=16){score+=2;why.push('plein jour')}else{score+=10;why.push('intermédiaire')}if(x.wind>=6&&x.wind<=18){score+=14;why.push('vent porteur')}else if(x.wind>28){score-=14;why.push('vent dur')}if(x.gust>=45){score-=18;why.push('rafales fortes')}if(x.pp<=20){score+=7;why.push('faible pluie')}else if(x.pp>55){score-=9;why.push('pluie probable')}if(x.cloud>=35&&x.cloud<=85){score+=9;why.push('lumière cassée')}if(x.uv>=5&&x.cloud<30){score-=11;why.push('soleil dur')}if(water==='cool')score+=5;else if(water==='mild')score-=4;if(clar==='clear')score-=2;else if(clar==='stained')score+=5;else score-=7;let danger=[95,96,99].includes(x.code)||x.gust>=55||(x.cape>=900&&x.pp>=35);if(danger){score=Math.min(score,12);why.unshift('STOP sécurité')}score=Math.max(0,Math.min(100,Math.round(score)));let plan='B',name='cassures / profond',depth='6-18 m',line='fluoro 20-22/100',lure='ondulante 7-14 g / souple 5-7 g',anim='descente comptée, lent',color='argent/cuivre';if(danger){plan='STOP';name='repli sécurité';depth='aucune pêche';line='—';lure='—';anim='canne rangée';color='—'}else if(score>=74&&(hr<=9||hr>=18)){plan='A';name='bordures / arrivées d’eau';depth='0-6 m';line='fluoro 16-18/100';lure='cuillère n°1-2 / minnow';anim='lent discret';color='naturel'}else if(score>=62&&x.wind>=8&&clar!=='clear'){plan='C';name='rive battue / prospection';depth='1-10 m';line='fluoro 18-22/100';lure='leurre dense contraste';anim='10-15 min/poste';color='noir/orange'}else if(score<52){plan='C';name='prospection prudente';depth='variable';lure='dense visible'}return{...x,score,why,danger,plan,name,depth,line,lure,anim,color,weather:W[x.code]||'code '+x.code,comp:comp(x.dir)}}function render(){if(!weather)weather=fallback();current=evalH(nearest());let r=current,col=r.danger?'#ff5470':r.score>=74?'#57d878':r.score>=52?'#ffd166':'#ff5470';q('ring').style.background=`conic-gradient(${col} ${r.score*3.6}deg,#19313d 0deg)`;q('score').textContent=r.score;q('plan').textContent=r.plan;q('planName').textContent=r.name;q('why').textContent=r.why.join(' • ');q('security').innerHTML=r.danger?'<b class=bad>STOP.</b> Canne rangée.':'<b class=ok>OK contrôlé.</b> Surveille ciel/vent.';q('setup').innerHTML=`<div class=metric><span>Profondeur</span><span>${r.depth}</span></div><div class=metric><span>Ligne</span><span>${r.line}</span></div><div class=metric><span>Leurre</span><span>${r.lure}</span></div><div class=metric><span>Couleur</span><span>${r.color}</span></div><div class=metric><span>Animation</span><span>${r.anim}</span></div>`;q('temp').textContent=f(r.temp,'°C');q('wind').textContent=f(r.wind,' km/h')+' '+r.comp;q('rain').textContent=f(r.pp,'%');q('pressure').textContent=f(r.p,' hPa');let s=spots.map(a=>{let sc=45+(a[2]===r.plan?30:0)+(r.plan==='A'&&a[0]==='A1'?18:0)+(r.plan==='B'&&a[0]==='B1'?18:0)+(r.plan==='C'&&a[0]==='C1'?16:0);if(r.danger)sc=0;return{a,sc:Math.max(0,Math.min(100,sc))}}).sort((a,b)=>b.sc-a.sc);q('spots').innerHTML=s.map(o=>`<div class=metric><span>${o.a[1]}<br><small class=small>${o.a[3]} · ${o.a[4]}</small></span><span>${o.sc}/100</span></div>`).join('');q('txt').textContent=`GRAND'MAISON ASSISTANT\n${new Date().toLocaleString('fr-FR')}\n\nPlan ${r.plan} — ${r.name} — ${r.score}/100\nMétéo: ${r.weather}, ${f(r.temp,'°C')}, vent ${f(r.wind,' km/h')} ${r.comp}, rafales ${f(r.gust,' km/h')}\nPluie: ${f(r.pp,'%')} Pression: ${f(r.p,' hPa')}\n\nSetup: ${r.depth} | ${r.line} | ${r.lure} | ${r.color} | ${r.anim}\nSpot: ${s[0]?.a[1]} (${s[0]?.sc}/100)\n\nRègle: 15 min sans signal = changer angle. 30 min = changer zone. Orage = STOP.`}async function sync(){q('status').textContent='Synchro live...';try{let res=await fetch(url(),{cache:'no-store'});if(!res.ok)throw Error(res.status);weather=await res.json();localStorage.gm_weather=JSON.stringify({at:Date.now(),weather});q('status').textContent='Live OK '+new Date().toLocaleTimeString('fr-FR');render()}catch(e){let c=localStorage.gm_weather;if(c){weather=JSON.parse(c).weather;q('status').textContent='Cache utilisé'}else{weather=fallback();q('status').textContent='Secours utilisé'}render()}}function log(t){if(!current)render();logs.push({at:new Date().toISOString(),type:t,score:current.score,plan:current.plan,lure:current.lure});localStorage.gm_logs=JSON.stringify(logs.slice(-200));alert(t+' enregistré')}async function shareTxt(){let text=q('txt').textContent;if(navigator.share)await navigator.share({text,title:'Pêche Grand Maison'});else copyTxt()}async function copyTxt(){await navigator.clipboard.writeText(q('txt').textContent);alert('Copié')}window.sync=sync;window.render=render;window.log=log;window.shareTxt=shareTxt;window.copyTxt=copyTxt;try{let c=localStorage.gm_weather;if(c)weather=JSON.parse(c).weather}catch(e){}render();sync();setInterval(sync,600000);setInterval(render,30000);</script></body></html>
